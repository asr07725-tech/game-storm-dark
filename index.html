<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Game Storm Dark Neon</title>

<style>

body{
background:#020617;
font-family:Arial;
color:white;
margin:0;
}

header{
background:black;
padding:20px;
font-size:35px;
text-align:center;
color:#00ffff;
text-shadow:0 0 20px #00ffff;
}

.search{
text-align:center;
padding:20px;
}

input{
padding:10px;
width:60%;
border-radius:10px;
border:none;
}

.menu{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap;
}

.menu button{
background:#ff00ff;
border:none;
padding:10px;
border-radius:10px;
color:white;
cursor:pointer;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.game{
background:#0f172a;
padding:15px;
border-radius:20px;
box-shadow:0 0 15px #00ffff55;
}

a{
display:block;
background:#ff00ff;
padding:8px;
border-radius:10px;
color:white;
text-decoration:none;
margin-top:10px;
text-align:center;
}

</style>

</head>

<body>

<header>⚡ Game Storm Dark Neon ⚡</header>

<div class="search">
<input type="text" id="search" placeholder="ابحث عن لعبة...">
</div>

<div class="menu">
<button onclick="filter('action')">أكشن</button>
<button onclick="filter('girls')">بنات</button>
<button onclick="filter('race')">سباق</button>
<button onclick="filter('sport')">رياضة</button>
<button onclick="filter('offline')">بدون نت</button>
<button onclick="filter('all')">الكل</button>
</div>

<div class="games" id="games"></div>

<!-- مكان الإعلانات -->
<div style="text-align:center;margin:40px">
اعلان هنا
</div>

<script>

let list=[];

for(let i=1;i<=300;i++){

let cat=['action','girls','race','sport','offline'][Math.floor(Math.random()*5)];

list.push({
name:"Game "+i,
cat:cat,
link:"https://play.google.com"
});

}

function show(arr){

let html="";

arr.forEach(g=>{
html+=`
<div class="game">
<h3>${g.name}</h3>
<a href="${g.link}" target="_blank">تحميل APK</a>
</div>
`;
});

document.getElementById("games").innerHTML=html;

}

function filter(c){

if(c=="all") show(list);
else show(list.filter(g=>g.cat==c));

}

document.getElementById("search").onkeyup=function(){

let v=this.value.toLowerCase();
show(list.filter(g=>g.name.toLowerCase().includes(v)));

}

show(list);

</script>

</body>
</html>
