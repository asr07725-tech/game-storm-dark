<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Game Storm Dark Neon</title>

<style>
body{
background:#020617;
font-family:Arial;
color:white;
text-align:center;
}

header{
font-size:40px;
padding:20px;
color:#00ffff;
text-shadow:0 0 20px #00ffff;
}

.section{
margin-top:40px;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px;
padding:20px;
}

.game{
background:#0f172a;
padding:15px;
border-radius:20px;
box-shadow:0 0 15px #00ffff55;
transition:0.3s;
}

.game:hover{
transform:scale(1.08);
box-shadow:0 0 25px #ff00ff;
}

a{
display:block;
background:#ff00ff;
padding:10px;
border-radius:10px;
color:white;
text-decoration:none;
margin-top:10px;
}

</style>

</head>

<body>

<header>⚡ Game Storm Dark Neon ⚡</header>

<div class="section">
<h2>📶 ألعاب بدون نت</h2>

<div class="games">

<div class="game">
<h3>Subway Surfers</h3>
<a href="https://play.google.com/store/apps/details?id=com.kiloo.subwaysurf">تحميل</a>
</div>

<div class="game">
<h3>Zombie Catchers</h3>
<a href="https://play.google.com/store/apps/details?id=fi.twomenandadog.zombiecatchers">تحميل</a>
</div>

</div>
</div>

<div class="section">
<h2>👗 ألعاب بنات</h2>

<div class="games">

<div class="game">
<h3>Princess Dress Up</h3>
<a href="https://play.google.com">تحميل</a>
</div>

<div class="game">
<h3>Makeup Salon</h3>
<a href="https://play.google.com">تحميل</a>
</div>

</div>
</div>

</body>
</html>
